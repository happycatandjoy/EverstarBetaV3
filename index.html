<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Everstar Beta 3 Core</title>

<style>

body{
margin:0;
overflow:hidden;
font-family:Arial,sans-serif;
background:#102040;
}

#creator{
position:absolute;
inset:0;
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
gap:8px;
background:#102040;
color:white;
z-index:1000;
}

#creator input,
#creator select,
#creator button{
width:260px;
padding:10px;
}

#studentCard{
background:rgba(255,255,255,.12);
padding:12px;
border-radius:10px;
text-align:center;
width:260px;
}

#ui{
display:none;
position:absolute;
top:10px;
left:10px;
background:rgba(0,0,0,.7);
color:white;
padding:10px;
border-radius:10px;
z-index:10;
}

canvas{
display:block;
}

</style>
</head>

<body>

<div id="creator">

<h1>🌟 EVERSTAR ACADEMY 🌟</h1>

<input
id="playerName"
placeholder="Student Name">

<select id="gender">
<option value="male">Male</option>
<option value="female">Female</option>
</select>

<select id="homeRealm">
<option value="earth">🌎 Earth Realm</option>
<option value="water">🌊 Water Realm</option>
<option value="fire">🔥 Fire Realm</option>
<option value="air">🌪 Air Realm</option>
</select>

<button id="randomCharacter">
🎲 Random Student
</button>

<div id="studentCard">

<b>Guardian</b><br>
🏫 Everstar Academy<br>
📚 First Year Student

</div>

<button id="startButton">
Begin Orientation Day
</button>

</div>

<div id="ui">

<div id="areaName">
🏫 Everstar Academy
</div>

<div id="questText">
Meet Headmaster Orion
</div>

</div>

<canvas id="game"></canvas>

<script>

// =====================
// DATA
// =====================

const earthNames = [
"Rowan","Briar","Cedar","Willow"
];

const waterNames = [
"Marina","River","Tide","Brook"
];

const fireNames = [
"Ember","Ash","Flare","Spark"
];

const airNames = [
"Zephyr","Nimbus","Skye","Cloud"
];

const surnames = [
"Oakheart",
"Tidewhisper",
"Ashflare",
"Cloudrunner",
"Everstar",
"Stormwind"
];

const dreams = {

earth:[
"Protect the Crystal Cave"
],

water:[
"Find the Hidden Lake"
],

fire:[
"Complete Volcano Trials"
],

air:[
"Reach Floating Isles"
]

};

const dorms = {

earth:"Stoneleaf Dorm",

water:"Riverstone Dorm",

fire:"Emberforge Dorm",

air:"Cloudspire Dorm"

};

// =====================
// PLAYER
// =====================

const playerData = {

name:"Guardian",
gender:"male",
homeRealm:"earth",
dorm:"",
dream:""

};

// =====================
// STUDENT CARD
// =====================

function updateStudentCard(){

const name =
document.getElementById(
"playerName"
).value || "Guardian";

const realm =
document.getElementById(
"homeRealm"
).value;

document.getElementById(
"studentCard"
).innerHTML =

"<b>"+name+"</b><br>" +
"🏫 Everstar Academy<br>" +
"📚 First Year Student<br>" +
"🌟 " + realm.toUpperCase() +
" Realm<br>" +
"🏠 " + dorms[realm];

}

// =====================
// RANDOM STUDENT
// =====================

function randomCharacter(){

const realms = [
"earth",
"water",
"fire",
"air"
];

const realm =
realms[
Math.floor(
Math.random() *
realms.length
)
];

let firstNames = [];

if(realm==="earth")
firstNames = earthNames;

if(realm==="water")
firstNames = waterNames;

if(realm==="fire")
firstNames = fireNames;

if(realm==="air")
firstNames = airNames;

const firstName =
firstNames[
Math.floor(
Math.random() *
firstNames.length
)
];

const surname =
surnames[
Math.floor(
Math.random() *
surnames.length
)
];

document.getElementById(
"playerName"
).value =
firstName +
" " +
surname;

document.getElementById(
"homeRealm"
).value =
realm;

playerData.dream =
dreams[realm][0];

updateStudentCard();

}

// =====================
// SAVE
// =====================

function saveProgress(){

localStorage.setItem(
"everstar-core-save",
JSON.stringify(
playerData
)
);

}

// =====================
// GAME
// =====================

const canvas =
document.getElementById(
"game"
);

const ctx =
canvas.getContext(
"2d"
);

function resize(){

canvas.width =
window.innerWidth;

canvas.height =
window.innerHeight;

}

resize();

window.addEventListener(
"resize",
resize
);

let gameStarted =
false;

const player = {

x:430,
y:500,
size:20,
speed:4

};

const keys = {};

window.addEventListener(
"keydown",
e=>{

keys[
e.key.toLowerCase()
] = true;

});

window.addEventListener(
"keyup",
e=>{

keys[
e.key.toLowerCase()
] = false;

});

// =====================
// START GAME
// =====================

function startGame(){

playerData.name =
document.getElementById(
"playerName"
).value || "Guardian";

playerData.gender =
document.getElementById(
"gender"
).value;

playerData.homeRealm =
document.getElementById(
"homeRealm"
).value;

playerData.dorm =
dorms[
playerData.homeRealm
];

saveProgress();

document.getElementById(
"creator"
).style.display =
"none";

document.getElementById(
"ui"
).style.display =
"block";

gameStarted = true;

}

// =====================
// BUTTONS
// =====================

document.getElementById(
"randomCharacter"
).addEventListener(
"click",
randomCharacter
);

document.getElementById(
"startButton"
).addEventListener(
"click",
startGame
);

document.getElementById(
"playerName"
).addEventListener(
"input",
updateStudentCard
);

document.getElementById(
"homeRealm"
).addEventListener(
"change",
updateStudentCard
);

updateStudentCard();

// =====================
// ACADEMY
// =====================

function drawAcademy(){

ctx.fillStyle =
"#79c46a";

ctx.fillRect(
0,
0,
canvas.width,
canvas.height
);

// academy

ctx.fillStyle =
"#c9b37e";

ctx.fillRect(
260,
60,
340,
120
);

ctx.fillStyle =
"black";

ctx.font =
"26px Arial";

ctx.fillText(
"EVERSTAR ACADEMY",
280,
130
);

// headmaster

ctx.fillStyle =
"purple";

ctx.beginPath();

ctx.arc(
430,
220,
25,
0,
Math.PI*2
);

ctx.fill();

ctx.fillStyle =
"white";

ctx.fillText(
"Headmaster Orion",
330,
180
);

// player

ctx.fillStyle =
"red";

ctx.beginPath();

ctx.arc(
player.x,
player.y,
player.size,
0,
Math.PI*2
);

ctx.fill();

}

// =====================
// LOOP
// =====================

function update(){

if(!gameStarted){

requestAnimationFrame(
update
);

return;

}

if(keys["w"])
player.y -= player.speed;

if(keys["s"])
player.y += player.speed;

if(keys["a"])
player.x -= player.speed;

if(keys["d"])
player.x += player.speed;

if(keys["arrowup"])
player.y -= player.speed;

if(keys["arrowdown"])
player.y += player.speed;

if(keys["arrowleft"])
player.x -= player.speed;

if(keys["arrowright"])
player.x += player.speed;

drawAcademy();

requestAnimationFrame(
update
);

}

update();

</script>

</body>
</html>
